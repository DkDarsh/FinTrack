<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - FinTrack</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0/dist/iife/sdk.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 flex justify-center items-center min-h-screen m-0 p-4 transition-colors duration-300">

    <div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 text-center animate-fade-in relative z-10 overflow-hidden">
        
        <!-- Indigo Top Accent Border -->
        <div class="w-full h-2 bg-indigo-600"></div>
        
        <div class="p-8">
            <!-- Icon -->
            <div class="w-16 h-16 bg-slate-50 dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 mx-auto flex items-center justify-center text-indigo-600 dark:text-indigo-400 text-3xl mb-6 relative z-20">
                <i class="fa-solid fa-wallet"></i>
            </div>
            
            <h1 class="text-2xl font-bold tracking-tight mb-2 text-slate-900 dark:text-white">Welcome to FinTrack</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mb-8">Sign in to securely manage your budget and track your expenses.</p>

            <button id="google-login-btn" class="w-full bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium py-3 px-4 rounded-xl border border-slate-300 dark:border-slate-600 shadow-sm transition-all flex items-center justify-center gap-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 active:scale-[0.98]">
                
                <!-- Google SVG Logo -->
                <svg id="google-icon" class="w-5 h-5" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>

                <!-- Loading Spinner (Hidden by default) -->
                <i id="loading-spinner" class="fa-solid fa-circle-notch fa-spin text-indigo-600 dark:text-indigo-400 hidden text-lg"></i>
                
                <span id="btn-text">Continue with Google</span>
            </button>
        </div>
    </div>

    <script>
        // 1. Check and Apply System Theme Preference
        const htmlElement = document.documentElement;
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        // 2. Initialize Appwrite SDK
        const client = new Appwrite.Client()
            .setEndpoint('https://fra.cloud.appwrite.io/v1') 
            .setProject('6abf4ef90031144466dc');             

        const account = new Appwrite.Account(client);

        // 3. Handle Login Button Click
        const loginBtn = document.getElementById('google-login-btn');
        const googleIcon = document.getElementById('google-icon');
        const loadingSpinner = document.getElementById('loading-spinner');
        const btnText = document.getElementById('btn-text');

        loginBtn.addEventListener('click', () => {
            // Update UI to show loading state
            loginBtn.disabled = true;
            loginBtn.classList.add('opacity-80', 'cursor-not-allowed');
            googleIcon.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');
            btnText.innerText = 'Connecting...';

            // Trigger Appwrite OAuth2 Flow
            try {
                account.createOAuth2Session(
                    Appwrite.OAuthProvider.Google, 
                    'https://dkdarsh.github.io/FinTrack.html', // Success Redirect
                    window.location.href                       // Failure Redirect (Stay on login)
                );
            } catch (error) {
                // In case of an immediate error, reset the button state
                console.error('Failed to initiate login:', error);
                loginBtn.disabled = false;
                loginBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                googleIcon.classList.remove('hidden');
                loadingSpinner.classList.add('hidden');
                btnText.innerText = 'Continue with Google';
            }
        });
    </script>
</body>
</html>
